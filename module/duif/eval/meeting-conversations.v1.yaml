      - {atMs: 80000, speaker: Nadia, text: "Dan zet ik het zo in de nota en stuur ik hem rond.", biological: 0.0, individualist: 0.0, nonverbal: 0.0}
      - {atMs: 96000, speaker: Sam, text: "Prima, dan hebben we dit punt gehad.", biological: 0.0, individualist: 0.0, nonverbal: 0.0}
      - {atMs: 112000, speaker: Voorzitter, text: "Nog even de planning: de nota moet voor de veertiende rond zijn.", biological: 0.0, individualist: 0.0, nonverbal: 0.0}
      - {atMs: 128000, speaker: Nadia, text: "Dat haal ik, mits ik de cijfers van de afdeling op tijd krijg.", biological: 0.0, individualist: 0.0, nonverbal: 0.0}
      - {atMs: 144000, speaker: Sam, text: "Die stuur ik je maandag, dan kun je dinsdag verder.", biological: 0.0, individualist: 0.0, nonverbal: 0.0}
      - {atMs: 158000, speaker: Voorzitter, text: "Afgesproken. Dan sluit ik dit agendapunt af.", biological: 0.0, individualist: 0.0, nonverbal: 0.0}
