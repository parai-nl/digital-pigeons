<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duivenlaag proef</title>
<style>
  :root { --serif: "Nanum Myeongjo", Georgia, "Times New Roman", serif; --sans: Fustat, ui-sans-serif, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); }
  section { padding: 28px 16px 36px; }
  .light { background: #faf9f7; color: #1c1c1c; }
  .dark { background: #2a2a2a; color: #f4f4f4; }
  h2 { font: 700 13px/1 var(--sans); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; opacity: .6; text-align: center; }
  .stage { position: relative; height: 470px; max-width: 940px; margin: 70px auto 0; }
  .slot { position: absolute; left: 50%; top: 0; transition: transform .55s cubic-bezier(.34,1.3,.64,1), opacity .45s, filter .45s; }
  .slot[data-rel="0"] { transform: translate(-50%, 0); z-index: 3; }
  .slot[data-rel="1"] { transform: translate(calc(-50% + 220px), 40px) scale(.78); z-index: 1; opacity: .5; filter: saturate(.85); }
  .slot[data-rel="2"] { transform: translate(calc(-50% - 220px), 40px) scale(.78); z-index: 1; opacity: .5; filter: saturate(.85); }
  .card { position: relative; width: 300px; aspect-ratio: .82; cursor: pointer; transform-style: preserve-3d; transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .2s ease-out; }
  /* Kantelen zoals op de site: plaat en duif bewegen apart (de duif ligt ervoor). */
  .card .layer { transform: translateZ(28px); }
  .plate { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; background: #ddd center / cover no-repeat; box-shadow: 0 12px 32px -8px rgb(0 0 0 / .14), 0 4px 8px -4px rgb(0 0 0 / .08); }
  .plate::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgb(0 0 0 / .7) 0%, rgb(0 0 0 / 0) 60%); }
  .slot[data-rel="0"] .plate { outline: 2px solid var(--accent); outline-offset: 3px; }
  .layer { position: absolute; pointer-events: none; }
  .layer img, .layer video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .layer video { visibility: hidden; }
  .layer.playing video.on { visibility: visible; }
  .layer.playing img { visibility: hidden; }
  .label { position: absolute; left: 14px; right: 14px; bottom: 14px; color: #fff; }
  .label small { display: block; font-size: 12px; font-weight: 600; opacity: .92; margin-bottom: 6px; }
  .label b { font: 800 22px/1.1 var(--serif); letter-spacing: -.01em; }
  .controls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button { font: 600 13px var(--sans); padding: 7px 12px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .meta { max-width: 720px; margin: 14px auto 0; font-size: 12px; line-height: 1.5; opacity: .7; text-align: center; }
  @media (max-width: 700px) { .slot[data-rel="1"] { transform: translate(calc(-50% + 150px), 40px) scale(.7); } .slot[data-rel="2"] { transform: translate(calc(-50% - 150px), 40px) scale(.7); } }
</style>
</head>
<body>
<section class="light"><h2>Licht</h2><div class="stage"></div><div class="controls"></div></section>
<section class="dark"><h2>Donker</h2><div class="stage"></div><div class="controls"></div><p class="meta"></p></section>
<script type="module">
// Proefpagina voor de beeldstroom: dezelfde opbouw als op de etalage
// (plaat binnen de kaart, duivenlaag met layer-box erbuiten, HEVC vóór WebM),
// zodat naad, alfaranden en leesbaarheid in een echte browser te beoordelen zijn.
const ROOT = '../../site/';
const manifest = await (await fetch(ROOT + 'etalage/media/duiven/manifest.json')).json();
const ORDER = ['signalerend', 'kennispartner', 'stakeholder'];   // Kennispartner vooraan
const INFO = {
  kennispartner: { name: 'Kennispartner', label: 'Wetenschappelijke kennis', accent: '#43674c' },
  stakeholder: { name: 'Stakeholder', label: 'Emotie & eigenbelang', accent: '#906714' },
  signalerend: { name: 'Signalerende duif', label: 'Luistert alleen mee', accent: '#5f6b75' },
};

function video(src) {
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto';
  v.innerHTML = `<source src="${ROOT + src.hevc}" type='video/quicktime; codecs="hvc1"'><source src="${ROOT + src.webm}" type="video/webm">`;
  return v;
}

function makeCard(id) {
  const p = manifest.pigeons[id], L = p.layer, info = INFO[id];
  const slot = document.createElement('div');
  slot.className = 'slot'; slot.style.setProperty('--accent', info.accent);
  slot.innerHTML = `<div class="card"><div class="plate" style="background-image:url(${ROOT + p.plate.src})"></div>
    <div class="layer" style="left:${L.left * 100}%;top:${L.top * 100}%;width:${L.width * 100}%;height:${L.height * 100}%">
      <img alt="" src="${ROOT + p.rest.src}"></div>
    <div class="label"><small>${info.label}</small><b>${info.name}</b></div></div>`;
  const layer = slot.querySelector('.layer');
  const clips = {};
  for (const [kind, src] of Object.entries(p.clips)) { clips[kind] = video(src); layer.append(clips[kind]); }
  let busy = false;
  slot.play = kind => {
    if (busy || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const v = clips[kind]; busy = true;
    v.currentTime = 0;
    const show = () => { v.classList.add('on'); layer.classList.add('playing'); };
    // Wissel pas als het eerste videobeeld echt op het scherm staat.
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(show); else v.addEventListener('playing', show, { once: true });
    v.addEventListener('ended', () => { layer.classList.remove('playing'); v.classList.remove('on'); busy = false; }, { once: true });
    v.play().catch(() => { busy = false; });
  };
  return slot;
}

for (const section of document.querySelectorAll('section')) {
  const stage = section.querySelector('.stage'), controls = section.querySelector('.controls');
  const slots = ORDER.map(makeCard);
  let active = 1;
  // Muis over de middelste kaart kantelt die licht (niet bij minder beweging).
  stage.addEventListener('pointermove', e => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const card = slots[active].querySelector('.card'), r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    card.style.setProperty('--ry', `${(x * 12).toFixed(2)}deg`); card.style.setProperty('--rx', `${(-y * 10).toFixed(2)}deg`);
  });
  stage.addEventListener('pointerleave', () => slots.forEach(s => { s.querySelector('.card').style.removeProperty('--rx'); s.querySelector('.card').style.removeProperty('--ry'); }));
  const layout = () => slots.forEach((s, i) => { s.dataset.rel = (i - active + slots.length) % slots.length; });
  slots.forEach((s, i) => { stage.append(s); s.addEventListener('click', () => { if (active !== i) { active = i; layout(); } else s.play(manifest.pigeons[ORDER[i]].defaultClip); }); });
  layout();
  for (const [i, id] of ORDER.entries()) for (const kind of Object.keys(manifest.pigeons[id].clips)) {
    const b = document.createElement('button');
    b.textContent = `${INFO[id].name} · ${kind}`;
    b.dataset.pigeon = id; b.dataset.clip = kind;
    b.addEventListener('click', () => { active = i; layout(); setTimeout(() => slots[i].play(kind), 350); });
    controls.append(b);
  }
  section.slots = slots;
  section.select = i => { active = i; layout(); };
}
document.querySelector('.meta').textContent = `Model: ${manifest.model.file} (${manifest.model.version}${manifest.model.final ? '' : ', voorlopig'}). ` + manifest.credits.map(c => c.nl).join(' — ');
window.etalagePreview = {
  manifest, sections: [...document.querySelectorAll('section')],
  // Voor shots.mjs: zet een vaste kanteling op de middelste kaart van elke sectie.
  tilt: (rx, ry) => document.querySelectorAll('.slot[data-rel="0"] .card').forEach(c => { c.style.transition = 'none'; c.style.setProperty('--rx', rx + 'deg'); c.style.setProperty('--ry', ry + 'deg'); }),
};
</script>
</body>
</html>
